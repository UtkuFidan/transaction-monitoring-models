[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-models"
version = "0.1.0"
description = "Transaction-monitoring lab: rule scenarios, ML scoring and an audit of thresholds (ATL/BTL)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Utku Fidan" }]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyyaml>=6",
  "networkx>=3.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "catboost>=1.2",
  "optuna>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ibm = ["remotezip>=0.12"]

[project.scripts]
tm-lab = "tm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tm_lab = ["thresholds.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
